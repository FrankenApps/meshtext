[package]
name = "meshtext"
version = "0.3.2"
edition = "2021"
exclude = [
    "assets/*",
    "benches/*",
    "cspell.config.yaml",
    "logo.png",
]
description = "Generate vertex-vertex meshes from text."
readme = "README.md"
repository = "https://github.com/FrankenApps/meshtext"
license = "MIT OR Apache-2.0"
keywords = ["graphics", "gamedev", "delaunay", "render", "triangulation"]
categories = ["graphics", "game-development", "rendering"]

[dependencies]
cdt = "0.1.0"
glam = "0.33.8"
skrifa = "0.47.0"
self_cell = { version = "1.3.0", optional = true }

[features]
default = []
owned = ["dep:self_cell"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
gltf-json = "1.4.1"
gltf = "1.4.1"
plotters = "0.3.7"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[[bench]]
name = "bench_main"
path = "benches/bench_main.rs"
harness = false
